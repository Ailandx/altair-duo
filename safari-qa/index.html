<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#171310">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>阿泰尔战棋</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #100e0c; color: #e7ddc8; font-family: system-ui, -apple-system, sans-serif; overscroll-behavior: none; }
    body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    #safe-area { position: fixed; inset: 0; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    #available { width: 100%; height: 100%; display: grid; place-items: center; }
    #canvas { display: block; border: 0; outline: 0; touch-action: none; }
    .cover { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); background: radial-gradient(ellipse at center, #30261c 0%, #181410 62%, #100e0c 100%); }
    .panel { width: min(540px, 94vw); text-align: center; padding: 30px; border: 1px solid #6e5836; box-shadow: 0 0 0 4px #181410, 0 24px 80px #0008; background: #201b16; }
    h1 { margin: 0 0 12px; font-size: clamp(28px, 5vw, 42px); letter-spacing: .13em; color: #f0e5cc; font-weight: 650; }
    p { margin: 12px 0; line-height: 1.65; color: #bfb29b; }
    button { min-height: 48px; min-width: 180px; margin: 14px 0 0; border: 1px solid #a38249; border-radius: 3px; padding: 10px 28px; background: #654727; color: #fff1d2; font: inherit; font-weight: 600; cursor: pointer; touch-action: manipulation; }
    button:active { background: #826035; }
    button:disabled { opacity: .6; cursor: default; }
    progress { width: 100%; height: 10px; margin: 18px 0 4px; accent-color: #bd9656; }
    #progress, #retry { display: none; }
    #rotate { z-index: 20; display: none; }
    #rotate .panel { width: min(420px, 90vw); }
    #rotate .turn { font-size: 44px; color: #b99151; }
    .small { font-size: 13px; color: #9c917d; }
    [hidden] { display: none !important; }
    @media (orientation: portrait) and (pointer: coarse) { #rotate { display: grid; } }
  </style>
  <link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
  <div id="safe-area"><div id="available"><canvas id="canvas" width="1420" height="848" tabindex="0">请使用支持画布的浏览器。</canvas></div></div>
  <section id="status" class="cover" aria-live="polite">
    <div class="panel">
      <h1>阿泰尔战棋</h1>
      <p id="message">八席争锋，构筑你的阵容。</p>
      <progress id="progress"></progress>
      <p id="loading-detail" class="small">横屏游玩 · 点击后启用声音</p>
      <button id="start" type="button">开始游戏</button>
      <button id="retry" type="button">重新加载</button>
    </div>
  </section>
  <section id="rotate" class="cover"><div class="panel"><div class="turn">↻</div><h1>横屏进入酒馆</h1><p>请将手机横过来，展开完整棋盘。</p></div></section>
  <noscript><div class="cover"><p>需要开启 JavaScript 才能进入酒馆。</p></div></noscript>
  <script id="aiden-parts-loader" src="asset-parts-loader.js"></script>
  <script>window.addEventListener("aiden-asset-error",function(event){if(typeof fail==="function")fail(event.detail);});</script>
  <script src="index.js"></script>
  <script>
    const GODOT_CONFIG = {"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":46972264,"index.wasm":38057390},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
    const GODOT_THREADS_ENABLED = false;
    const diagnostics = window.__aidenDiagnostics = { state: 'ready', threads: GODOT_THREADS_ENABLED, logs: [], errors: [], safeArea: {}, startupAt: null };
    const canvas = document.getElementById('canvas');
    const available = document.getElementById('available');
    const status = document.getElementById('status');
    const start = document.getElementById('start');
    const retry = document.getElementById('retry');
    const message = document.getElementById('message');
    const detail = document.getElementById('loading-detail');
    const progress = document.getElementById('progress');
    const engine = new Engine(GODOT_CONFIG);
    function logLine(kind, args) {
      const text = Array.from(args).join(' ');
      diagnostics[kind].push(text);
      if (diagnostics[kind].length > 200) diagnostics[kind].shift();
      (kind === 'errors' ? console.error : console.log)(text);
    }
    function fitCanvas() {
      const rect = available.getBoundingClientRect();
      const scale = Math.min(rect.width / 1420, rect.height / 848);
      canvas.style.width = Math.floor(1420 * scale) + 'px';
      canvas.style.height = Math.floor(848 * scale) + 'px';
      diagnostics.safeArea = { width: rect.width, height: rect.height, canvasWidth: canvas.clientWidth, canvasHeight: canvas.clientHeight };
    }
    function fail(error) {
      diagnostics.state = 'error';
      diagnostics.errors.push(String(error && error.message || error));
      status.hidden = false;
      message.textContent = '暂时无法进入酒馆';
      detail.textContent = String(error && error.message || error);
      start.hidden = true;
      progress.style.display = 'none';
      retry.style.display = 'inline-block';
    }
    async function begin() {
      if (diagnostics.state !== 'ready') return;
      const missing = Engine.getMissingFeatures({ threads: false });
      if (missing.length) { fail('当前浏览器缺少运行支持，请更新 Safari 或使用较新的浏览器。'); return; }
      diagnostics.state = 'loading';
      diagnostics.startupAt = performance.now();
      start.disabled = true;
      start.hidden = true;
      progress.style.display = 'block';
      message.textContent = '正在准备酒馆';
      detail.textContent = '首次进入需要加载游戏，请稍候。';
      canvas.focus();
      const touch = window.matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0;
      const args = touch ? ['--', '--touch-input'] : [];
      try {
        await engine.startGame({
          canvas, args,
          onProgress: (loaded, total) => {
            if (total > 0) { progress.max = total; progress.value = loaded; detail.textContent = `${Math.floor(100 * loaded / total)}% · ${(loaded / 1048576).toFixed(1)} / ${(total / 1048576).toFixed(1)} MB`; }
            else { progress.removeAttribute('value'); detail.textContent = '正在启动酒馆…'; }
          },
          onPrint: (...args) => logLine('logs', args),
          onPrintError: (...args) => logLine('errors', args),
          onExit: (code) => { diagnostics.exitCode = code; if (code !== 0) fail(`游戏已退出（${code}），请重新加载。`); }
        });
        diagnostics.state = 'running';
        diagnostics.startedInMs = Math.round(performance.now() - diagnostics.startupAt);
        status.hidden = true;
        fitCanvas();
        canvas.focus();
      } catch (error) { fail(error); }
    }
    start.addEventListener('click', begin);
    retry.addEventListener('click', () => location.reload());
    canvas.addEventListener('contextmenu', event => event.preventDefault());
    window.addEventListener('resize', fitCanvas);
    window.visualViewport?.addEventListener('resize', fitCanvas);
    document.addEventListener('visibilitychange', () => { diagnostics.visibility = document.visibilityState; if (!document.hidden) { fitCanvas(); canvas.focus(); } });
    window.addEventListener('error', event => { diagnostics.errors.push(event.message); });
    window.addEventListener('unhandledrejection', event => { diagnostics.errors.push(String(event.reason)); });
    fitCanvas();
  </script>
</body>
</html>
